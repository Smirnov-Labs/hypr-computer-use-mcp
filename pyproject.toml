[project]
name = "hypr-cua-mcp"
version = "0.1.1"
description = "Hyprland/Wayland computer-use MCP server — screenshot (grim) + click/type (uinput) with hyprctl-tree targeting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3",
    "pillow>=10",
    "evdev>=1.9.3",
    "websocket-client>=1.9.0",
]

[project.scripts]
hypr-cua-mcp = "hypr_cua_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypr_cua_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
