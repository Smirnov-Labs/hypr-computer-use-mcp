[project]
name = "hypr-cua-mcp"
version = "0.1.0"
description = "i3-aware computer-use MCP server for X11 — screenshot + click/type via xdotool with i3-tree targeting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3",
    "i3ipc>=2.2",
    "pillow>=10",
    "python-xlib>=0.33",
]

[project.scripts]
hypr-cua-mcp = "hypr_cua_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypr_cua_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
