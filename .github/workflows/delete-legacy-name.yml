name: Delete legacy registry name

# One-shot: hide the superseded io.github.Smirnov-Labs/hypr-cua-mcp registry entry
# (status=deleted, a reversible soft-delete) after re-homing to com.smirnovlabs/hypr-cua-mcp.
# Auth is GitHub OIDC as the repo (grants io.github.Smirnov-Labs). Delete this workflow
# once it has run.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # GitHub OIDC → io.github.Smirnov-Labs/*
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar -xz mcp-publisher
          chmod +x mcp-publisher
      - name: Log in via GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Delete io.github.Smirnov-Labs/hypr-cua-mcp
        run: |
          echo y | ./mcp-publisher status --status deleted --all-versions \
            --message "Superseded by com.smirnovlabs/hypr-cua-mcp" \
            io.github.Smirnov-Labs/hypr-cua-mcp
