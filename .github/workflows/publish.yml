name: Publish

# Publish to PyPI on a GitHub Release. Before tagging, bump `version` in BOTH
# pyproject.toml and server.json to match the release tag (e.g. v0.2.0 -> 0.2.0).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  pypi:
    name: PyPI (Trusted Publishing)
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hypr-cua-mcp
    permissions:
      id-token: write        # OIDC token for PyPI Trusted Publishing — no API-token secret to store or leak
      contents: read         # job-level permissions REPLACE (not merge with) the top-level default, so checkout needs this here too
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Build sdist + wheel
        run: uv build
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # One-time setup on PyPI → Manage → Publishing → add a Trusted Publisher:
        #   project: hypr-cua-mcp · owner: Smirnov-Labs · repo: hypr-computer-use-mcp
        #   · workflow: publish.yml · environment: pypi
        # (Preferred over an API token: nothing secret lives in the repo or CI.)

  # The MCP registry listing is a separate workflow — .github/workflows/publish-mcp.yml
  # (OIDC as the repo → the io.github.Smirnov-Labs namespace). Run it after a release;
  # keeping it separate means re-running it never re-triggers a PyPI upload.
