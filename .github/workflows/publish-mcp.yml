name: Publish to MCP Registry

# Lists server.json (com.smirnovlabs/hypr-cua-mcp) in the MCP registry.
# The com.smirnovlabs namespace is verified by a DNS TXT record on smirnovlabs.com,
# so registry auth uses the Ed25519 signing key (NOT GitHub OIDC). To run this in CI,
# add a repo secret MCP_DNS_PRIVATE_KEY = the key hex (from the local key stored at
# ~/.config/mcp/smirnovlabs-ed25519.key). Then, after a PyPI release:
#   gh workflow run publish-mcp.yml
# Or publish locally with no secret at all:
#   mcp-publisher login dns --domain smirnovlabs.com --private-key <hex> && mcp-publisher publish

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: mcp-publisher (DNS auth)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install mcp-publisher
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz | tar -xz mcp-publisher
          chmod +x mcp-publisher
      - name: Validate server.json
        run: ./mcp-publisher validate server.json
      - name: Log in via DNS
        run: ./mcp-publisher login dns --domain smirnovlabs.com --private-key "${{ secrets.MCP_DNS_PRIVATE_KEY }}"
      - name: Publish to the registry
        run: ./mcp-publisher publish
